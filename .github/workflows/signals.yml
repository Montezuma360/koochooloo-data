name: Refresh signals and dashboard

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 minutes, every day (2 minutes after the other jobs)
  workflow_run:                # and straight after every price or SEC refresh, so the dashboard is never a cycle behind
    workflows: ["Refresh brain data", "Refresh SEC insider data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Congress, signals and dashboard
        run: python refresh_signals.py
      - name: Data health check
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python health.py
      - name: Commit changes
        if: always()
        run: |
          git config user.name "koochooloo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "Signals refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
