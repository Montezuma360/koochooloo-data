name: Refresh alternative data

on:
  schedule:
    - cron: "35 23 * * 1-5"   # weekdays after FINRA posts the day's short-sale file
    - cron: "0 14 * * 6"      # Saturday: picks up Friday's CFTC report and new SEC files
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alt-data
  cancel-in-progress: false

jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect free public data
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python refresh_alt.py
      - name: Commit changes
        run: |
          git config user.name "koochooloo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alt data/history
          git diff --staged --quiet && exit 0
          git commit -m "Alternative data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((2 + RANDOM % 8)); done  # random wait: runs every minute can collide
          exit 1
