name: Refresh brain data

on:
  schedule:
    - cron: "20 * * * 1-5"   # hourly at 20 past, Monday to Friday (UTC)
  workflow_dispatch: {}       # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenBB
        run: pip install openbb
      - name: Pull data
        run: python refresh.py
      - name: Commit changes
        run: |
          git config user.name "koochooloo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
