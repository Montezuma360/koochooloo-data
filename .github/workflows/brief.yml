name: Morning brief
# Weekdays before the UK open: writes data/brief/latest.md and .html; with the BUTTONDOWN_KEY secret it also saves a draft email.
on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the brief
        env:
          BUTTONDOWN_KEY: ${{ secrets.BUTTONDOWN_KEY }}
        run: python brief.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brief
          git diff --cached --quiet && exit 0
          git commit -q -m "Morning brief $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((2 + RANDOM % 8)); done
